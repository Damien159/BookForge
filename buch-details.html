<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Buch Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Platzhalter für die Detailansicht -->
  <main class="product-detail-container">
    <div class="product-cover-container">
      <img id="detail-cover" src="" alt="Buchcover">
    </div>

    <div class="product-info-container">
      <span id="detail-author"></span>
      <h1 id="detail-title">Lädt...</h1>
      <p id="detail-subtitle"></p>
      <div id="detail-price" class="price"></div>
      
      <button id="add-to-cart-btn" class="primary-btn">In den Warenkorb</button>
    </div>

    <div class="product-description">
      <h2>Beschreibung</h2>
      <p id="detail-description"></p>
    </div>
  </main>

  <script src="details.js"></script>
</body>
</html>
