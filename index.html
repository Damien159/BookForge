<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookForge</title>
  </head>

  <body>
    <header>
      <h1>BookForge</h1>
      <input type="text" placeholder="Titel, Autor, ISBN..." />
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Mein Konto</a></li>
          <li><a href="#">Favoriten</a></li>
          <li><a href="#">Warenkorb</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <div>
          <img src="img/Homescreen.jpg" alt="Homescreen" />
          <h2>Willkommen bei BookForge</h2>
          <p>Hier findest du die neuesten Bücher</p>
          <input type="text" placeholder="Suche nach Büchern..." />
          <button>Suche</button>
        </div>
        <div class="bestseller">
          <a href="#">
            <p>Bestseller</p>
          </a>
        </div>
        <div class="bestseller">
          <a href="#">
            <p>Neuheiten</p>
          </a>
        </div>
        <div class="bestseller">
          <a href="#">
            <p>Sale%</p>
          </a>
        </div>
        <div class="bestseller">
          <a href="#">
            <p>Romane</p>
          </a>
        </div>
        <div class="bestseller">
          <a href="#">
            <p>Empfehlungen</p>
          </a>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 BookForge. Alle Rechte vorbehalten.</p>
      <a href="#">Datenschutz</a> | <a href="#">Impressum</a>
    </footer>
  </body>
</html>
